name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy
      - name: Sintaxe dos scripts JS
        run: for f in $(find src headless vendor -name '*.js'); do node --check "$f"; done
      - name: Testes de regressão (motor, Python, modelo)
        run: python tests/rodar_testes.py
      - name: Testes da interface (jsdom)
        run: npm install --no-save jsdom && node tests/ui_smoke.mjs
